name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run installer test suite
        run: bash tests/test_install.sh
      - name: Run content contract suite
        run: bash tests/test_content.sh
      - name: Run spec adapter suite
        run: python3 -I tests/test_specs_adapter.py
      - name: Run flow runner suite
        run: python3 -I tests/test_test_flows.py
      - name: Run security flow suite
        run: python3 -I tests/test_security_flow.py
